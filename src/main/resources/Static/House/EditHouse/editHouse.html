<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Просмотр и изменение параметров дома</title>
        <link rel="stylesheet" href="edit-house-style.css">
    </head>

    <body>
        <div class="form-div">
            <form id="myForm" class="form-container">
                <div class="form-row">
                    <div class="label-column">Адрес:</div>
                    <div class="value-column">
                        <input type="text" id="address" maxlength="200">
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">ТСЖ:</div>
                    <div class="value-column">
                        <select id="hoaName" class="selector-class"></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">Общая площадь:</div>
                    <div class="value-column">
                        <input type="number" id="livingArea" max="99999" min="100">
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">Этажность:</div>
                    <div class="value-column">
                        <input type="number" id="numOfFloors" max="100" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">Подъездов:</div>
                    <div class="value-column">
                        <input type="number" id="numOfSections" max="20" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">Входных групп:</div>
                    <div class="value-column">
                        <input type="number" id="numOfEntrances" max="20" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">Квартир:</div>
                    <div class="value-column">
                        <input type="number" id="numOfFlats" max="1000" min="2">
                    </div>
                </div>

                <div class="form-row">
                    <div class="label-column">Нежилых помещений:</div>
                    <div class="value-column">
                        <input type="number" id="numOfOffices" max="100" min="0">
                    </div>
                </div>

                <div class="buttons">
                    <button type="button" class="cancel-btn">Отменить</button>
                    <button type="submit" class="save-btn">Сохранить</button>
                    <button type="submit" class="save-close-btn">Сохранить и закрыть</button>
                </div>
            </form>
        </div>

        <script src="../../config.js" defer></script>
        <script src="editHouse.js" defer></script>

    </body>

</html>
