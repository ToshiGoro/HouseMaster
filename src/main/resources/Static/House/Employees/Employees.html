<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обслуживающий персонал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: url('../../images/StarterBackground.png') center/cover no-repeat fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            padding: 20px;
        }

        .close-btn {
            position: fixed;
            top: 40px;
            right: calc(50% - 600px + 20px);
            background-color: rgba(80, 80, 255, 50%);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            padding: 8px 16px;
            cursor: pointer;
            z-index: 1000;
            font-size: 14px;
        }

        .close-btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(80, 80, 255, 35%);
            border-radius: 10px;
            border: 1px solid grey;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, rgba(80, 80, 255, 80%) 0%, rgba(120, 80, 200, 80%) 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
            font-weight: 300;
        }

        .header .subtitle {
            font-size: 1em;
            opacity: 0.9;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: rgba(80, 80, 255, 25%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 3px;
        }

        .table-container {
            overflow-x: auto;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.9);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            font-size: 0.85em;
            background: white;
            border: 2px solid rgba(80, 80, 255, 70%);
        }

        thead {
            background-color: rgba(80, 80, 255, 70%);
            color: white;
        }

        th {
            padding: 8px 6px;
            text-align: left;
            font-weight: 600;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
        }

        th:last-child {
            border-right: none;
        }

        tbody tr {
            border-bottom: 1px solid #dee2e6;
            transition: background-color 0.2s ease;
            height: 35px;
        }

        tbody tr:hover {
            background-color: rgba(80, 80, 255, 0.1);
        }

        td {
            padding: 6px 4px;
            vertical-align: top;
            border-right: 1px solid #dee2e6;
        }

        td:last-child {
            border-right: none;
        }

        .gender-male {
            color: #007bff;
        }

        .gender-female {
            color: #e83e8c;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #6c757d;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #dc3545;
            background: rgba(248, 215, 218, 0.9);
            margin: 15px;
            border-radius: 5px;
        }

        /* Стили для модальных окон */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 700px;
            max-width: 90%;
            border: 2px solid rgba(80, 80, 255, 70%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #dee2e6;
        }

        .modal-title {
            font-size: 1.4em;
            color: rgba(80, 80, 255, 90%);
            font-weight: 600;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
            line-height: 1;
        }

        .modal-close:hover {
            color: #000;
        }

        .action-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin: 0 auto;
        }

        .contacts-btn {
            background-color: #17a2b8;
            color: white;
        }

        .contacts-btn:hover {
            background-color: #138496;
            transform: scale(1.1);
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c82333;
            transform: scale(1.1);
        }

        /* Стили для модальных уведомлений */
        .alert-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .alert-content {
            background-color: #fefefe;
            margin: 20% auto;
            padding: 25px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            border: 2px solid rgba(80, 80, 255, 70%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .alert-title {
            font-size: 1.3em;
            color: rgba(80, 80, 255, 90%);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .alert-message {
            margin-bottom: 25px;
            color: #333;
            line-height: 1.5;
            font-size: 1em;
        }

        .alert-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .alert-btn {
            padding: 10px 20px;
            border: 1px solid rgba(80, 80, 255, 50%);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s ease;
            min-width: 100px;
        }

        .alert-btn-primary {
            background-color: rgba(80, 80, 255, 70%);
            color: white;
        }

        .alert-btn-primary:hover {
            background-color: rgba(80, 80, 255, 80%);
        }

        .alert-btn-secondary {
            background-color: #f8f9fa;
            color: #495057;
            border-color: #ddd;
        }

        .alert-btn-secondary:hover {
            background-color: #e9ecef;
        }

        .add-btn {
            background-color: #28a745;
            color: white;
        }

        .add-btn:hover {
            background-color: #218838;
            transform: scale(1.1);
        }

        .edit-btn {
            background-color: #ffc107;
            color: white;
        }

        .edit-btn:hover {
            background-color: #e0a800;
            transform: scale(1.1);
        }

        .contacts-btn {
            background-color: #17a2b8;
            color: white;
        }

        .contacts-btn:hover {
            background-color: #138496;
            transform: scale(1.1);
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c82333;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            th, td {
                padding: 6px 4px;
                font-size: 0.75em;
            }

            .table-container {
                padding: 10px;
            }

            .close-btn {
                top: 10px;
                right: 10px;
                padding: 6px 12px;
                font-size: 12px;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85em;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(80, 80, 255, 25%);
        }
    </style>
    <link rel="stylesheet" href="../contactsManager.css">
    <link rel="stylesheet" href="../personForm.css">
    <link rel="stylesheet" href="employeeForm.css">

</head>
<body>
<button class="close-btn" onclick="window.close()">Закрыть</button>

<!-- Модальное окно для уведомлений -->
<div id="alertModal" class="alert-modal">
    <div class="alert-content">
        <h3 class="alert-title" id="alertTitle">Уведомление</h3>
        <div class="alert-message" id="alertMessage"></div>
        <div class="alert-buttons">
            <button class="alert-btn alert-btn-primary" id="alertOkButton">OK</button>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения -->
<div id="confirmModal" class="alert-modal">
    <div class="alert-content">
        <h3 class="alert-title" id="confirmTitle">Подтверждение</h3>
        <div class="alert-message" id="confirmMessage"></div>
        <div class="alert-buttons">
            <button class="alert-btn alert-btn-secondary" id="confirmCancelButton">Отмена</button>
            <button class="alert-btn alert-btn-primary" id="confirmOkButton">OK</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header">
        <h1>Обслуживающий персонал</h1>
        <div id="subtitle" class="subtitle"></div>
    </div>

    <div class="stats" id="stats">
        <div class="stat-item">
            <div class="stat-number" id="totalEmployees">-</div>
            <div class="stat-label">Всего сотрудников</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="maleEmployees">-</div>
            <div class="stat-label">Мужчин</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="femaleEmployees">-</div>
            <div class="stat-label">Женщин</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="averageAge">-</div>
            <div class="stat-label">Средний возраст</div>
        </div>
    </div>

    <div class="table-container">
        <div id="loading" class="loading">
            Загрузка данных...
        </div>

        <div id="error" class="error" style="display: none;">
            Ошибка загрузки данных. Пожалуйста, проверьте подключение к серверу.
        </div>

        <table id="employeesTable" style="display: none;">
            <thead>
            <tr>
                <th>ФИО</th>
                <th>Пол</th>
                <th>Возраст</th>
                <th>Должность</th>
                <th style="width: 120px;">Действия</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div class="footer">
        Система управления жилым фондом • Обновлено: <span id="updateTime"></span>
    </div>
</div>

<script src="../../config.js" defer></script>
<script defer>
    const urlParams = new URLSearchParams(window.location.search);
    const houseId = urlParams.get('houseId');
    const HOUSE_ID = houseId;

    const elements = {
        loading: document.getElementById('loading'),
        error: document.getElementById('error'),
        table: document.getElementById('employeesTable'),
        tableBody: document.getElementById('tableBody'),
        subtitle: document.getElementById('subtitle'),
        stats: {
            totalEmployees: document.getElementById('totalEmployees'),
            maleEmployees: document.getElementById('maleEmployees'),
            femaleEmployees: document.getElementById('femaleEmployees'),
            averageAge: document.getElementById('averageAge')
        },
        updateTime: document.getElementById('updateTime'),
        alertModal: document.getElementById('alertModal'),
        alertTitle: document.getElementById('alertTitle'),
        alertMessage: document.getElementById('alertMessage'),
        alertOkButton: document.getElementById('alertOkButton'),
        confirmModal: document.getElementById('confirmModal'),
        confirmTitle: document.getElementById('confirmTitle'),
        confirmMessage: document.getElementById('confirmMessage'),
        confirmCancelButton: document.getElementById('confirmCancelButton'),
        confirmOkButton: document.getElementById('confirmOkButton')
    };

    let currentEmployeeData = null;
    let houseAddress = '';
    let scrollPosition = 0;
    let allEmployeesData = [];
    let filtersInitialized = false;

    // Функции для работы с уведомлениями
    function showAlert(title, message) {
        elements.alertTitle.textContent = title;
        elements.alertMessage.textContent = message;
        elements.alertModal.style.display = 'block';
    }

    function hideAlert() {
        elements.alertModal.style.display = 'none';
    }

    function showConfirm(title, message) {
        return new Promise((resolve) => {
            elements.confirmTitle.textContent = title;
            elements.confirmMessage.textContent = message;
            elements.confirmModal.style.display = 'block';

            const cleanup = () => {
                elements.confirmModal.style.display = 'none';
                elements.confirmOkButton.onclick = null;
                elements.confirmCancelButton.onclick = null;
            };

            elements.confirmOkButton.onclick = () => {
                cleanup();
                resolve(true);
            };

            elements.confirmCancelButton.onclick = () => {
                cleanup();
                resolve(false);
            };
        });
    }

    // Настройка обработчиков для модальных окон уведомлений
    elements.alertOkButton.onclick = hideAlert;
    elements.alertModal.onclick = function(e) {
        if (e.target === elements.alertModal) {
            hideAlert();
        }
    };
    elements.confirmModal.onclick = function(e) {
        if (e.target === elements.confirmModal) {
            elements.confirmModal.style.display = 'none';
        }
    };

    function saveScrollPosition() {
        scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
    }

    function restoreScrollPosition() {
        window.scrollTo(0, scrollPosition);
    }

    async function deleteEmployee(personId, employeeName) {
        const confirmed = await showConfirm(
            'Увольнение сотрудника',
            `Вы уверены, что хотите уволить сотрудника "${employeeName}"?`
        );

        if (!confirmed) return;

        try {
            // Удаляем должности сотрудника в этом доме
            const positionsResponse = await fetch(`${BACKEND_URL}/positions/person/${personId}`);
            if (positionsResponse.ok) {
                const positions = await positionsResponse.json();
                const housePositions = positions.filter(pos => pos.houseId === HOUSE_ID);

                // Удаляем все должности сотрудника в этом доме
                for (const position of housePositions) {
                    await fetch(`${BACKEND_URL}/positions/${position.id}`, {
                        method: 'DELETE'
                    });
                }
            }

            showAlert('Успех', `Сотрудник "${employeeName}" уволен`);
            await loadData();
        } catch (error) {
            console.error('Ошибка:', error);
            showAlert('Ошибка', 'Ошибка при увольнении сотрудника');
        }
    }

    function showContacts(employee) {
        contactsManager.showContacts(employee.id, employee.fullName);
    }

    function formatGender(gender) {
        return gender ? 'Мужской' : 'Женский';
    }

    function formatAge(age, birthDate) {
        // Если возраст передан - используем его
        if (age !== null && age !== undefined) {
            return formatAgeString(age);
        }

        // Если есть дата рождения - вычисляем возраст
        if (birthDate) {
            const today = new Date();
            const birth = new Date(birthDate);
            let calculatedAge = today.getFullYear() - birth.getFullYear();

            // Корректируем если день рождения еще не наступил в этом году
            const monthDiff = today.getMonth() - birth.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                calculatedAge--;
            }

            return formatAgeString(calculatedAge);
        }

        return 'Неизвестно';

    }

    function formatAgeString(age) {
        const lastDigit = age % 10;
        const lastTwoDigits = age % 100;

        if (lastTwoDigits >= 11 && lastTwoDigits <= 19) {
            return age + ' лет';
        }

        if (lastDigit === 1) {
            return age + ' год';
        }

        if (lastDigit >= 2 && lastDigit <= 4) {
            return age + ' года';
        }

        return age + ' лет';
    }

    async function apiRequest(endpoint) {
        try {
            const response = await fetch(`${BACKEND_URL}${endpoint}`);

            if (!response.ok) {
                throw new Error(`Ошибка HTTP! Статус: ${response.status}`);
            }

            return await response.json();
        } catch (error) {
            console.error(`Ошибка API-запроса для ${endpoint}:`, error);
            throw error;
        }
    }

    async function loadHouseData() {

        try {
            const houseData = await apiRequest(`/houses/get/${HOUSE_ID}`);

            return houseData;

        } catch (error) {
            console.error('Ошибка загрузки данных дома:', error);

            return null;

        }

    }

    async function loadEmployeesData() {
        try {
            const positionsData = await apiRequest(`/positions/house/${HOUSE_ID}`);
            console.log('Raw positions data:', positionsData);

            const employeesWithFullData = await Promise.all(
                positionsData.map(async (position) => {
                    try {
                        const personData = await apiRequest(`/persons/get/${position.personId}`);
                        console.log(`Person ${position.personId} data:`, personData); // ← ДОБАВЬ
                        return {
                            ...position,
                            person: personData
                        };
                    } catch (error) {
                        console.error(`Ошибка загрузки человека ${position.personId}:`, error);
                        return position;
                    }
                })
            );

            return employeesWithFullData;

        } catch (error) {
            console.error('Ошибка загрузки данных сотрудников:', error);
            throw error;
        }

    }

    function updateHeader(houseData) {
        if (houseData && houseData.address) {
            elements.subtitle.textContent = houseData.address;
            houseAddress = houseData.address;
        } else {
            elements.subtitle.textContent = 'Адрес не указан';
            houseAddress = 'Адрес не указан';
        }
    }

    async function loadData() {
        saveScrollPosition();

        try {
            elements.loading.style.display = 'block';
            elements.error.style.display = 'none';
            elements.table.style.display = 'none';

            const houseData = await loadHouseData();
            updateHeader(houseData);

            const employeesData = await loadEmployeesData();

            renderTable(employeesData);
            updateStats(employeesData);
            updateTimestamp();

        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            elements.loading.style.display = 'none';
            elements.error.style.display = 'block';
            elements.table.style.display = 'none';
        } finally {
            setTimeout(restoreScrollPosition, 100);
        }
    }

    function renderTable(employeesData) {
        console.log('Rendering employees data:', employeesData);

        allEmployeesData = employeesData;
        let html = '';

        // Первая строка - создание нового сотрудника
        html += `
    <tr style="background-color: rgba(40, 167, 69, 0.1);">
        <td>
            <div style="font-weight: 500; color: #28a745; font-style: italic;">
                Создать новую запись
            </div>
        </td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td style="text-align: center;">
            <div style="display: flex; gap: 5px; justify-content: center;">
                <button class="action-btn add-btn"
                        onclick="createNewEmployee()"
                        title="Добавить сотрудника">
                    +
                </button>
            </div>
        </td>
    </tr>
    `;

        // Остальные строки - существующие сотрудники
        employeesData.forEach(employee => {
            const person = employee.person || {};
            const positionType = employee.positionType || {};

            const genderClass = person.gender ? 'gender-male' : 'gender-female';
            const formattedAge = formatAge(person.age, person.birthDate);
            const personName = employee.personName || person.fullName || `${person.lastName || ''} ${person.firstName || ''} ${person.secondName || ''}`.trim();

            html += `
        <tr>
            <td>
                <div style="font-weight: 500; color: #212529;">
                    ${personName}
                </div>
            </td>
            <td class="${genderClass}">
                ${formatGender(person.gender)}
            </td>
            <td>${formattedAge}</td>
            <td>
                <div style="font-weight: 600; color: #495057;">
                    ${positionType.positionType || 'Не указана'}
                </div>
            </td>
            <td style="text-align: center;">
                <div style="display: flex; gap: 5px; justify-content: center;">
                    <button class="action-btn contacts-btn"
                            onclick="showContacts('${person.id}', '${person.firstName}')"
                            title="Контакты">
                        📞
                    </button>
                    <button class="action-btn edit-btn"
                            onclick="editEmployee(${JSON.stringify(employee).replace(/"/g, '&quot;')})"
                            title="Редактировать">
                        ✏️
                    </button>
                    <button class="action-btn delete-btn"
                            onclick="deleteEmployee('${person.id}', '${personName}')"
                            title="Уволить">
                        ×
                    </button>
                </div>
            </td>
        </tr>
        `;
        });

        elements.tableBody.innerHTML = html;
        elements.loading.style.display = 'none';
        elements.table.style.display = 'table';

        if (!filtersInitialized) {
            initFilters();
            filtersInitialized = true;
        }

    }

    function initFilters() {
        const filterManager = new FilterManager();

        // Создаем фильтры
        const nameFilter = filterManager.addFilter(new TextFilter(0, 'Поиск по ФИО...'));
        const genderFilter = filterManager.addFilter(new CheckboxFilter(1, {
            'male': 'Муж',
            'female': 'Жен'
        }));
        const ageFilter = filterManager.addFilter(new RangeFilter(2));
        const positionFilter = filterManager.addFilter(new TextFilter(3, 'Поиск по должности...'));

        const headers = elements.table.querySelectorAll('thead th');
        headers[0].appendChild(nameFilter.createInput());
        headers[1].appendChild(genderFilter.createInputs());
        headers[2].appendChild(ageFilter.createInputs());
        headers[3].appendChild(positionFilter.createInput());

        filterManager.setOnFilterChange(() => {
            console.log('=== FILTER CHANGE TRIGGERED ===');
            const allRows = Array.from(elements.table.querySelectorAll('tbody tr'));
            console.log('Total rows:', allRows.length);

            allRows.forEach((row, index) => {
                if (index === 0) {
                    row.style.display = '';
                    console.log('Row 0 (create) - always visible');
                    return;
                }

                const shouldShow = filterManager.applyFilters([row]).length > 0;
                console.log(`Row ${index}: shouldShow = ${shouldShow}`);

                // ОТЛАДКА: что в ячейках этой строки?
                const cells = row.cells;
                console.log(`Row ${index} data:`, {
                    name: cells[0].textContent,
                    gender: cells[1].textContent,
                    age: cells[2].textContent,
                    position: cells[3].textContent
                });

                row.style.display = shouldShow ? '' : 'none';
            });
        });
    }

    function updateStats(employeesData) {
        const totalEmployees = employeesData.length;

        const maleEmployees = employeesData.filter(e => {
            const person = e.person || {};
            return person.gender === true;
        }).length;

        const femaleEmployees = employeesData.filter(e => {
            const person = e.person || {};
            return person.gender === false;
        }).length;

        // РАСЧЕТ ВОЗРАСТОВ
        const ages = employeesData.map(employee => {
            const person = employee.person || {};

            // Если возраст явно указан - используем его
            if (person.age !== null && person.age !== undefined) {
                return person.age;
            }

            // Если есть дата рождения - вычисляем возраст из нее
            if (person.birthDate) {
                const today = new Date();
                const birthDate = new Date(person.birthDate);
                let age = today.getFullYear() - birthDate.getFullYear();

                // Корректируем если день рождения еще не наступил в этом году
                const monthDiff = today.getMonth() - birthDate.getMonth();
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }

                return age;

            }

            // Если возраст неизвестен - возвращаем null
            return null;

        });

        // Фильтруем только известные возраста
        const knownAges = ages.filter(age => age !== null && age > 0);

        // Рассчитываем средний возраст
        let averageAge = '-';
        if (knownAges.length > 0) {
            const sum = knownAges.reduce((a, b) => a + b, 0);
            averageAge = Math.round(sum / knownAges.length);
        }

        // Обновляем статистику
        elements.stats.totalEmployees.textContent = totalEmployees;
        elements.stats.maleEmployees.textContent = maleEmployees;
        elements.stats.femaleEmployees.textContent = femaleEmployees;
        elements.stats.averageAge.textContent = averageAge;
    }

    function updateTimestamp() {
        const now = new Date();
        elements.updateTime.textContent = now.toLocaleString('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function createNewEmployee() {
        employeeForm.showCreate(HOUSE_ID, () => {
            loadData();
        });
    }

    function editEmployee(employee) {
        employeeForm.showEdit(employee.person.id, HOUSE_ID, () => {
            loadData();
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        if (!HOUSE_ID) {
            showAlert('Ошибка', 'Не указан идентификатор дома');
            return;
        }
        loadData();
        setInterval(loadData, 5 * 60 * 1000);
    });

    window.addEventListener('error', function (e) {
        console.error('Global error:', e.error);
    });

</script>

        // Инициализируем менеджеры
        contactsManager = new ContactsManager(BACKEND_URL);

    });
</script>
